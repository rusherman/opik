variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  RUNNER_ZJK_TAG: k8s-runner-zjk-svc
  REGION: cn-zhangjiakou
  REGISTRY: dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA
  GIT_STRATEGY: clone

include:
  - local: ".deploy-ci.yml"

stages:
  - build
  - deploy-test

image: $REGISTRY/public/ubuntu:gitlab-0.0.2
services:
  - $REGISTRY/public/docker:20.10.16-dind

.curl: &curl >-
  /busybox/curl --retry 3 --retry-delay 10 -s -X POST -H "Content-Type: application/json" -H "X-Gitlab-Token: ${secret}"  --data-binary """{
  \"image\":\"$DOCKER_IMAGE\",
  \"pipeline_id\":$CI_PIPELINE_ID,
  \"tag\":\"$CI_COMMIT_TAG\",
  \"branch\":\"$CI_COMMIT_BRANCH\",
  \"server_name\":\"$SERVER_NAME\",
  \"user\":\"$AUTHOR_NAME\",
  \"commit_id\":\"$CI_COMMIT_SHA\",
  \"step\":\"$CI_JOB_STAGE\",
  \"project_id\":$CI_PROJECT_ID,
  \"build_id\":$CI_JOB_ID,
  \"step_status\":\"$CI_JOB_STATUS\",
  \"gitlab_url\":\"$CI_PIPELINE_URL\",
  \"deploy_name\":\"$CI_JOB_NAME\"}""" ${devops} > result.json

# =============================================================================
# Build: opik-backend
# =============================================================================
docker-build-backend:
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
    DOCKER_BUILDKIT: "1"
  stage: build
  image: $REGISTRY/public/ubuntu:gitlab-docker
  before_script:
    - |
      DOCKER_TAG=${CI_PIPELINE_ID}
      DOCKER_NAME=opik-backend
    - DOCKER_IMAGE=$REGISTRY/flow/${DOCKER_NAME}:${DOCKER_TAG}
    - AUTHOR_NAME=$(git log -1 --pretty=format:"%an" --no-merges)
  script:
    - echo "Building opik-backend image - ${DOCKER_IMAGE}"

    # registry auth
    - |
      cat > /root/.docker/config.json <<EOF
      {
        "auths": {
          "registry.dp.tech": {
            "auth": "$(echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64)"
          },
          "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
            "auth": "$(echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64)"
          }
        }
      }
      EOF

    - |
      cd ${CI_PROJECT_DIR} && docker buildx build --progress=plain \
        --build-arg OPIK_VERSION=${OPIK_VERSION}-${CI_PIPELINE_ID} \
        -f apps/opik-backend/Dockerfile \
        -t ${DOCKER_IMAGE} \
        --cache-to type=inline,mode=max \
        --push \
        apps/opik-backend/

    # Also tag with version
    - docker buildx imagetools create -t $REGISTRY/flow/${DOCKER_NAME}:${OPIK_VERSION}-feishu ${DOCKER_IMAGE}

    - SERVER_NAME=opik-backend
    - *curl

  retry: 2
  tags:
    - k8s-runner-ack
  rules:
    - if: "$CI_COMMIT_BRANCH =~ $BRANCH || $CI_COMMIT_TAG"
      changes:
        - apps/opik-backend/**/*
        - .gitlab-ci.yml
    - if: "$CI_PIPELINE_SOURCE == 'web'"

# =============================================================================
# Build: opik-frontend
# =============================================================================
docker-build-frontend:
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
    DOCKER_BUILDKIT: "1"
  stage: build
  image: $REGISTRY/public/ubuntu:gitlab-docker
  before_script:
    - |
      DOCKER_TAG=${CI_PIPELINE_ID}
      DOCKER_NAME=opik-frontend
    - DOCKER_IMAGE=$REGISTRY/flow/${DOCKER_NAME}:${DOCKER_TAG}
    - AUTHOR_NAME=$(git log -1 --pretty=format:"%an" --no-merges)
  script:
    - echo "Building opik-frontend image - ${DOCKER_IMAGE}"

    # registry auth
    - |
      cat > /root/.docker/config.json <<EOF
      {
        "auths": {
          "registry.dp.tech": {
            "auth": "$(echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64)"
          },
          "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
            "auth": "$(echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64)"
          }
        }
      }
      EOF

    - |
      cd ${CI_PROJECT_DIR} && docker buildx build --progress=plain \
        --build-arg OPIK_VERSION=${OPIK_VERSION}-${CI_PIPELINE_ID} \
        -f apps/opik-frontend/Dockerfile \
        -t ${DOCKER_IMAGE} \
        --cache-to type=inline,mode=max \
        --push \
        apps/opik-frontend/

    # Also tag with version
    - docker buildx imagetools create -t $REGISTRY/flow/${DOCKER_NAME}:${OPIK_VERSION}-feishu ${DOCKER_IMAGE}

    - SERVER_NAME=opik-frontend
    - *curl

  retry: 2
  tags:
    - k8s-runner-ack
  rules:
    - if: "$CI_COMMIT_BRANCH =~ $BRANCH || $CI_COMMIT_TAG"
      changes:
        - apps/opik-frontend/**/*
        - .gitlab-ci.yml
    - if: "$CI_PIPELINE_SOURCE == 'web'"

# =============================================================================
# Deploy: test environment
# =============================================================================
deploy-test:
  stage: deploy-test
  tags:
    - $RUNNER_ZJK_TAG
  script:
    - echo "Deploy to test environment"
    - |
      echo "Backend:  $REGISTRY/flow/opik-backend:${CI_PIPELINE_ID}"
      echo "Frontend: $REGISTRY/flow/opik-frontend:${CI_PIPELINE_ID}"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ $BRANCH && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null'
      when: manual
